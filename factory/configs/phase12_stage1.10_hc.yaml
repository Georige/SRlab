# Phase 12 Stage 1.10: High-capacity W-VFE
# base_ch=128, n_blocks=12 → ~8M params
# CondEncoder + aligned augment

experiment:
  name: phase12_stage1.10_hc
  phase: phase12
  stage: stage1.10
  desc: "W-VFE base_ch=128 n_blocks=12 + CondEncoder + aligned augment"
  trainer: wavelet_flow

model:
  type: wavelet_flow
  base_ch: 128
  n_blocks: 12
  time_dim: 256

data:
  hr_size: [512, 1024]
  scale: 4
  data_dir: lau_dataset/sun_test
  n_train: 16
  n_val: 4

training:
  lr: 2.0e-4
  epochs: 400
  l1_weight: 0.1
  infer_steps: 4
  augmentation:
    roll_prob: 0.5
    crop_prob: 0.9
    color_prob: 0.7
    noise_std: 0.005
    noise_prob: 0.3

output:
  dir: phase12_output
  log_dir: phase12_output/logs
