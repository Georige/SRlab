# Phase 12 Stage 0: Direct Wavelet Regression — Single Image Sanity
# Verifies that direct wavelet regression works before multi-image training.
# Should easily surpass bicubic on a single image.

experiment:
  name: phase12_stage0_direct
  phase: phase12
  stage: stage0
  desc: "Direct wavelet regression — single image sanity check"
  trainer: wavelet_direct

model:
  type: wavelet_direct
  base_ch: 64
  n_blocks: 8

data:
  hr_size: [512, 1024]
  scale: 4
  data_dir: lau_dataset/sun_test
  n_train: 1
  n_val: 1

training:
  lr: 2.0e-4
  epochs: 200
  l1_weight: 0.1
  augmentation:
    roll_prob: 0.5
    crop_prob: 0.9
    color_prob: 0.7
    noise_std: 0.005
    noise_prob: 0.3

output:
  dir: phase12_output
  log_dir: phase12_output/logs
