# Phase 9 Stage 2: Direct SR baseline — full dataset (80 images)
experiment:
  name: phase9_stage2_direct_sr
  phase: phase9
  stage: stage2
  desc: "Direct SR baseline — one-step 3→3 U-Net, 80 train images"
  trainer: focus_refine

model:
  type: direct_sr
  in_ch: 3
  base_ch: 64
  out_ch: 3

data:
  hr_size: [512, 512]
  full_size: [1024, 2048]   # source panorama (H, W) — images are 2048×1024
  scale: 2
  data_dir: lau_dataset/sun_test
  n_train: 80
  n_val: 10
  crops_per_image: 10

training:
  mode: direct
  lr: 5.0e-5
  epochs: 1000
  use_residual: true

output:
  dir: phase9_output
  log_dir: phase9_output/logs
