# Phase 6 Stage 2.2: +PolarMoE
experiment:
  name: s2.2_polar_moe
  phase: phase6
  stage: stage2
  desc: "PolarMoE with load balancing (lambda=0.01)"

model:
  type: direct_unet
  cond_ch: 6
  base_ch: 64
  latent_ch: 0
  use_polar_moe: true
  use_circular_conv: false
  use_coord_embed: false
  use_spherical_attn: false
  ms_injection: add
  out_ch: 3

data:
  hr_size: [512, 1024]
  scale: 4
  data_dir: lau_dataset/sun_test
  n_train: 16
  n_val: 4
  l_cond: 255
  ms_cond: [[128, 2], [64, 4], [32, 8]]

training:
  lr: 5.0e-5
  epochs: 400
  residual_l2_weight: 1.0e-4
  balance_weight: 0.01
  augmentation:
    roll_prob: 0.5
    crop_prob: 0.9
    color_prob: 0.7
    noise_std: 0.005
    noise_prob: 0.3

output:
  dir: phase6_output
  log_dir: phase6_output/logs
