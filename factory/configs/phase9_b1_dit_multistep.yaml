# Phase 9 Route B-1: Multi-Step Iterative Refinement DiT
# Drop-in replacement for FocusRefineUNet — same training loop, DiT backbone
experiment:
  name: phase9_b1_dit_multistep
  phase: phase9
  stage: b1
  desc: "B-1 MultiStepDiT — FocusAttention + AdaLN, 5-step iterative refinement, 7ch input"
  trainer: focus_refine

model:
  type: dit_multistep
  in_ch: 7                 # I_low_up(3) + current(3) + mask(1)
  dim: 512                 # transformer hidden dim
  depth: 8                 # # DiT blocks
  num_heads: 8
  patch_size: 16           # 16×16 patches → 32×64 tokens on 512×1024
  mlp_ratio: 4

data:
  hr_size: [512, 1024]
  scale: 2
  data_dir: datasets/realsr_v3/Canon/Train/2
  n_train: 50
  n_val: 2
  crops_per_image: 3

training:
  mode: iterative          # same 5-step TF loop as U-Net
  lr: 5.0e-5
  epochs: 500
  num_steps: 5
  center_regions: [[512, 1024], [384, 768], [256, 512], [128, 256], [64, 128]]
  use_residual: true
  teacher_noise_std: 0.02

output:
  dir: phase9_output
  log_dir: phase9_output/logs
