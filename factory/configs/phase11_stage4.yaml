# Phase 11 Stage 4: GAN + perceptual for emergent texture
# Adds PatchGAN discriminator for local texture realism
# Warm-start from Stage 3 checkpoint recommended
experiment:
  name: phase11_s4_gan
  phase: phase11
  stage: stage4
  desc: "MorphoSR Stage 4: real LR + pre-encoder + VGG + PatchGAN + L1"
  trainer: morpho

model:
  type: morpho_sr
  state_ch: 16
  hidden_ch: 64
  cond_ch: 3
  use_pre_encoder: true
  pre_encoder_ch: 32
  pre_encoder_n: 4

data:
  hr_size: [800, 1400]
  scale: 2
  data_dir: lau_dataset/realsr_canon
  n_train: 10
  n_val: 2
  image_index: 0

training:
  lr: 5.0e-4          # Lower LR for GAN stability
  epochs: 2000
  n_steps: 15
  n_steps_min: 10
  n_steps_max: 20
  random_steps: true
  p_update: 0.5
  use_condition: true
  overflow_weight: 0.01
  ssim_weight: 0.5
  vgg_weight: 0.05
  gan_weight: 0.01
  gan_type: lsgan
  crop_size: [256, 256]
  batches_per_epoch: 100
  base_ckpt: phase11_output/phase11_s3_real_lr_vgg/best_model.pt  # Warm start from Stage 3

output:
  dir: phase11_output
  log_dir: phase11_output/logs
