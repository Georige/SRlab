# Phase 11 Stage 1.5 v2: Residual growth + per-step injection + zero-init + ensemble
# Fixes over v1:
#   1. Residual prediction: SR = bicubic_up + model_residual
#   2. Per-step injection: overwrite state[:, -3:] with bicubic each step
#   3. Zero-init: init_conv starts at zero → initial SR = bicubic exactly
#   4. Ensemble validation: 4-run average with p_update=0.5 (match training)
experiment:
  name: phase11_s1.5_v2_zero_ensemble
  phase: phase11
  stage: stage1.5
  desc: "MorphoSR Stage 1.5 v2: zero-init + residual + inject + ensemble×4"
  trainer: morpho

model:
  type: morpho_sr
  state_ch: 16
  hidden_ch: 64
  cond_ch: 0
  inject_cond: true
  zero_init: true       # Zero init_conv → initial SR = bicubic (no random noise)
  use_pre_encoder: false

data:
  hr_size: [800, 1400]
  scale: 2
  data_dir: lau_dataset/realsr_canon
  n_train: 1
  n_val: 1
  image_index: 0

training:
  lr: 1.0e-3
  epochs: 500
  n_steps: 15
  random_steps: false
  p_update: 0.5
  use_condition: true
  residual_mode: true
  val_ensemble: 4        # 4-run average with p_update=0.5, reduces variance
  overflow_weight: 0.01
  ssim_weight: 0.0
  vgg_weight: 0.0
  gan_weight: 0.0
  crop_size: null
  batches_per_epoch: 1

output:
  dir: phase11_output
  log_dir: phase11_output/logs
