# Phase 7 Stage 3c: Very aggressive teacher noise — base_ch=64 + teacher_noise_std=0.15
# Stage 3b achieved AR=27.96 dB. Gap to TF (31.63) is still 3.66 dB.
# Higher noise should bridge more of the gap.
experiment:
  name: phase7_s3c_noise15
  phase: phase7
  stage: stage3c
  desc: "Very aggressive teacher noise — base_ch=64, noise_std=0.15, resume from s3b"
  trainer: center_growing

model:
  type: center_growing
  in_ch: 10
  out_ch: 3
  base_ch: 64

data:
  hr_size: [1024, 2048]
  scale: 2
  data_dir: lau_dataset/odisr/training
  n_train: 1
  n_val: 1
  image_index: 0

training:
  lr: 2.0e-4
  epochs: 500
  use_residual: true
  teacher_noise_std: 0.15
  resume_ckpt: phase7_output/phase7_s3b_noise10/best_model.pt
  start_epoch: 726

output:
  dir: phase7_output
  log_dir: phase7_output/logs
