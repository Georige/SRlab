# Phase 12 Stage 1.8: W-VFE with strong CondEncoder
# lr_up fed to Conv2d(3→32→64, stride=2) → 64ch feature map
# Concatenated with x_t + LL_lr as "navigation hologram" at each step.
# Phase-aligned augmentation + lr=2e-4.

experiment:
  name: phase12_stage1.8_condenc
  phase: phase12
  stage: stage1.8
  desc: "W-VFE + CondEncoder (64ch lr_up features) + aligned augment + lr=2e-4"
  trainer: wavelet_flow

model:
  type: wavelet_flow
  base_ch: 64
  n_blocks: 8
  time_dim: 256

data:
  hr_size: [512, 1024]
  scale: 4
  data_dir: lau_dataset/sun_test
  n_train: 16
  n_val: 4

training:
  lr: 2.0e-4
  epochs: 200
  l1_weight: 0.1
  infer_steps: 4
  augmentation:
    roll_prob: 0.5
    crop_prob: 0.9
    color_prob: 0.7
    noise_std: 0.005
    noise_prob: 0.3

output:
  dir: phase12_output
  log_dir: phase12_output/logs
