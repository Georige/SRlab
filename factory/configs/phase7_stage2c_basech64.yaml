# Phase 7 Stage 2c: Higher capacity — base_ch=64, LR=2e-4 (TF bound was only 24 dB)
experiment:
  name: phase7_s2c_basech64
  phase: phase7
  stage: stage2c
  desc: "Center-growing UNet base_ch=64, single-image overfit — 512×1024→1024×2048"
  trainer: center_growing

model:
  type: center_growing
  in_ch: 10
  out_ch: 3
  base_ch: 64

data:
  hr_size: [1024, 2048]
  scale: 2
  data_dir: lau_dataset/odisr/training
  n_train: 1
  n_val: 1
  image_index: 0

training:
  lr: 2.0e-4
  epochs: 500
  use_residual: true
  teacher_noise_std: 0.0

output:
  dir: phase7_output
  log_dir: phase7_output/logs
